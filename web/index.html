<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Debugger Benchmark</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a14;color:#f8fafc;font:15px/1.5 system-ui,sans-serif}.shell{max-width:1400px;margin:auto;padding:48px clamp(20px,5vw,72px)}header{margin-bottom:48px}.brand{display:flex;align-items:center;gap:14px}h1{font-size:clamp(28px,4vw,40px);margin:0}.mark{background:#175bd0;padding:10px;border-radius:12px}.sub{color:#9aa7ba;font-size:17px}.section{margin-bottom:50px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8290a5;margin-bottom:20px}.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.agent,.challenge{padding:20px;border:1px solid #202c40;border-radius:15px;background:#0d1525;cursor:pointer}.agent.selected{border:2px solid #3679f6;background:#102349}.radio{width:17px;height:17px;border:2px solid #58667b;border-radius:50%;margin-bottom:17px}.selected .radio{border:6px solid #3679f6}.agent h3{margin:0}.model{font:12px monospace;color:#8290a5}.challenges{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.challenge:hover,.agent:hover{border-color:#3679f6}.tag{font-size:10px;color:#a5b1c3}.challenge h4{margin:8px 0 2px;font-size:13px}.diff{font-size:10px;color:#8290a5}.start{border:0;border-radius:30px;padding:15px 28px;background:#1e293b;font-weight:bold;color:white;cursor:pointer}.start:disabled{opacity:.45;cursor:not-allowed}.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:20px}.modal{width:min(640px,100%);background:#0d1525;border:1px solid #202c40;border-radius:16px;padding:22px}.modalhead{display:flex;justify-content:space-between;font-weight:bold}.close{background:none;border:0;color:white;font-size:22px;cursor:pointer}.bugtype{color:#8997aa;font-style:italic;margin:16px 0}.code{white-space:pre-wrap;background:#030711;padding:16px;border-radius:9px;color:#cad5e4;font:13px/1.6 monospace}.dashboard{min-height:100vh;background:#0b0f1a;padding:24px clamp(16px,3vw,38px);color:#dbe3ef}.dash-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.dash-top h2{margin:0;color:white;font-size:21px}.legend{display:flex;flex-wrap:wrap;gap:12px 18px;font-size:11px;color:#bac5d5}.legend span{white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.panel,.card{background:#111827;border:1px solid #263244;border-radius:17px;box-shadow:0 12px 30px #0002}.chart-panel{padding:22px;margin-bottom:22px}.chart{height:225px;margin-top:14px}.chart svg{width:100%;height:100%;overflow:visible}.gridline{stroke:#253044;stroke-dasharray:4 5}.axis{fill:#728199;font:11px system-ui}.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden}.card-head{padding:17px;border-bottom:1px solid #263244;display:flex;justify-content:space-between;gap:8px;align-items:center}.card-head h3{margin:0;font-size:15px;color:#fff}.active{font-size:9px;letter-spacing:.1em;border:1px solid;padding:4px 9px;border-radius:18px}.slider{padding:18px 14px;background:#0d121d;display:flex;align-items:center;gap:7px}.slide{flex:1;min-width:0;height:72px;padding:9px;border:1px solid #293348;border-radius:9px;opacity:.45;background:#101827}.slide.current{border-color:#3b82f6;opacity:1;background:#13213a;box-shadow:0 5px 16px #0005}.slide small{display:block;color:#8997aa;font-weight:bold;font-size:9px}.slide strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{height:3px;background:#293348;margin-top:8px;border-radius:3px}.progress i{display:block;height:100%;background:#3b82f6;width:35%}.arrows{border:0;background:none;color:#8090a7;cursor:pointer;font-size:19px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:17px;font-size:12px}.metrics small{display:block;color:#78869a;margin-bottom:3px}.metrics strong{font-weight:550}.diffbox{margin:0 17px 17px;background:#080d16;border:1px solid #263244;border-radius:8px;padding:10px;font:10px/1.7 monospace}.minus{color:#f87171}.plus{color:#4ade80}.back{margin:0 0 15px;background:none;border:0;color:#9aa7ba;cursor:pointer}@media(max-width:950px){.agents{grid-template-columns:repeat(2,1fr)}.challenges{grid-template-columns:repeat(3,1fr)}.agent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.agents{grid-template-columns:1fr}.challenges{grid-template-columns:repeat(2,1fr)}.agent-grid{grid-template-columns:1fr}.dash-top{display:block}.legend{margin-top:14px}.chart{height:190px}}
</style>
<style>.report-link{float:right;margin:-48px 0 14px;background:#2563eb;border:1px solid #2563eb;border-radius:9px;padding:9px 13px;color:#fff;font-weight:700;cursor:pointer}.report-link:hover{background:#1d4ed8}.agent-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.agent-choice{padding:26px;border:1px solid #263244;border-radius:16px;background:#0d1525;text-align:left;cursor:pointer;color:#f8fafc}.agent-choice:hover{border-color:#3679f6;background:#101d33}.agent-choice strong{display:block;font-size:17px;margin-bottom:5px}.agent-choice span{color:#8997aa;font-size:13px}.choice-icon{font-size:24px;color:#60a5fa;margin-bottom:12px}.agent-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.small-btn{background:transparent;border:1px solid #344156;border-radius:8px;padding:8px 12px;color:#cbd5e1;cursor:pointer}.small-btn:hover{border-color:#3b82f6}.custom-form{max-width:560px;background:#0d1525;border:1px solid #263244;border-radius:16px;padding:22px;display:grid;gap:14px}.custom-form label{display:grid;gap:6px;color:#a9b5c7;font-size:12px}.custom-form input{background:#070d18;border:1px solid #344156;border-radius:8px;color:white;padding:11px 12px;font:inherit}.custom-note{font-size:11px;color:#8290a5}.form-actions{display:flex;gap:9px}.form-actions button{padding:10px 14px;border-radius:8px;border:1px solid #344156;background:#172132;color:white;cursor:pointer}.form-actions button[type=submit]{background:#2563eb;border-color:#2563eb}@media(max-width:650px){.report-link{float:none;margin:0 0 14px}.agent-choices{grid-template-columns:1fr}.agent-tools{align-items:flex-start;flex-direction:column}}</style>
<main id="app"></main>
<script>
var challenges=[['Binary Search Off-by-One','Easy','Boundary conditions'],['Mutable Default Trap','Medium','Shared mutable defaults'],['Dict Mutation During Iteration','Medium','Iterator invalidation'],['Floating Point Comparison','Medium','Precision error'],['Silent Exception Swallowing','Medium','Hidden exception'],['Thread-Unsafe Counter','Hard','Race condition'],['Closure Variable Capture','Medium','Late binding'],['Unicode Normalization','Medium','NFC / NFD mismatch'],['Recursive Fibonacci Blowup','Hard','Exponential runtime'],['File Handle Leak','Medium','Resource leak'],['Incorrect Merge Sort','Medium','Merge logic'],['Cache Poisoning','Hard','Mutable references']];
var agents=[['GPT-4o Debugger','gpt-4o-2024-05-13'],['Claude 3.5 Sonnet','claude-3-5-sonnet-v1'],['Llama 3 70B','llama-3-70b-instruct'],['Codestral','mistral-large-latest']],selected=[],preview=-1,view='selection',agentMode='choose',app=document.getElementById('app'),challengeSeconds={},timerHandle=null;
function render(){if(view==='execution'){renderExecution();return}
var a='<div class="shell"><header><div class="brand"><span class="mark">⌘</span><h1>AI Debugger Benchmark</h1></div><p class="sub">Choose the agents to evaluate against 12 coding challenges.</p></header><section class="section"><h2 class="eyebrow">Agent Evaluation Preview</h2>';
if(agentMode==='choose'){a+='<p class="sub" style="margin:0 0 18px">Start with a preset agent or add your own.</p><div class="agent-choices"><button class="agent-choice" id="choose-given"><div class="choice-icon">◉</div><strong>Choose a preset agent</strong><span>Select from the available benchmark models.</span></button><button class="agent-choice" id="choose-custom"><div class="choice-icon">＋</div><strong>Add a custom agent</strong><span>Enter a display name and model identifier.</span></button></div>'}
else if(agentMode==='custom'){a+='<div class="agent-tools"><button class="small-btn" id="mode-back">← Agent choices</button></div><form class="custom-form" id="custom-form"><label>Agent name<input id="custom-name" required maxlength="48" placeholder="e.g. My Debugger"></label><label>Model identifier<input id="custom-model" required maxlength="96" placeholder="e.g. provider/model-name"></label><div class="custom-note">Custom agents use sample benchmark values in this prototype.</div><div class="form-actions"><button type="button" id="cancel-custom">Cancel</button><button type="submit">Add Agent</button></div></form>'}
else{a+='<div class="agent-tools"><button class="small-btn" id="mode-back">← Agent choices</button><button class="small-btn" id="add-custom">＋ Add custom agent</button></div><div class="agents">';agents.forEach(function(x,i){a+='<article class="agent '+(selected.indexOf(i)>=0?'selected':'')+'" data-agent="'+i+'"><div class="radio"></div><h3>'+escapeHTML(x[0])+'</h3><div class="model">'+escapeHTML(x[1])+'</div></article>'});a+='</div>'}
a+='</section><section class="section"><h2 class="eyebrow">Benchmark Suite (12 Challenges)</h2><div class="challenges">';
challenges.forEach(function(x,i){a+='<article class="challenge" data-ch="'+i+'"><span class="tag">#'+(i+1)+'　⚑</span><h4>'+x[0]+'</h4><div class="diff">'+x[1]+'</div></article>'});a+='</div></section><button class="start" id="start" '+(selected.length?'':'disabled')+'>▶　Start Evaluation</button></div>';
if(preview>=0)a+='<div class="overlay" id="overlay"><section class="modal"><div class="modalhead"><span>▤　'+challenges[preview][0]+'</span><button class="close" id="close">×</button></div><div class="bugtype">Bug Type: '+challenges[preview][2]+'</div><pre class="code">def solve(data):\n  # Buggy implementation\n  for i in range(len(data)):\n    if data[i] == target: # target is undefined\n      return i\n  return -1</pre></section></div>';
app.innerHTML=a;
var chooseGiven=document.getElementById('choose-given'),chooseCustom=document.getElementById('choose-custom'),backMode=document.getElementById('mode-back'),addCustom=document.getElementById('add-custom'),cancelCustom=document.getElementById('cancel-custom'),customForm=document.getElementById('custom-form');
if(chooseGiven)chooseGiven.onclick=function(){agentMode='given';render()};if(chooseCustom)chooseCustom.onclick=function(){agentMode='custom';render()};if(backMode)backMode.onclick=function(){agentMode='choose';render()};if(addCustom)addCustom.onclick=function(){agentMode='custom';render()};if(cancelCustom)cancelCustom.onclick=function(){agentMode='given';render()};
if(customForm)customForm.onsubmit=function(e){e.preventDefault();var name=document.getElementById('custom-name').value.trim(),model=document.getElementById('custom-model').value.trim();if(!name||!model)return;var i=agents.length;agents.push([name,model]);themes.push(themes[i%4]);series.push(series[i%4].slice());labels.push(name);selected.push(i);agentMode='given';render()};
document.querySelectorAll('[data-agent]').forEach(function(el){el.onclick=function(){var i=+el.dataset.agent,p=selected.indexOf(i);if(p>=0)selected.splice(p,1);else selected.push(i);render()}});
document.querySelectorAll('[data-ch]').forEach(function(el){el.onclick=function(){preview=+el.dataset.ch;render()}});
document.getElementById('start').onclick=function(){selected.forEach(function(i){challengeSeconds[i]=102});view='execution';render()};
if(preview>=0){document.getElementById('close').onclick=function(){preview=-1;render()};document.getElementById('overlay').onclick=function(e){if(e.target.id==='overlay'){preview=-1;render()}}}}
function escapeHTML(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
var themes=['#3b82f6','#a855f7','#f59e0b','#10b981'],series=[[45,52,48,60,55],[30,35,40,42,38],[80,75,90,85,70],[50,45,60,55,50]],labels=['GPT-4o Debugger','Claude 3.5 Sonnet','Llama 3 70B','Codestral'];
function renderExecution(){var d='<div class="dashboard"><button class="back" id="back">← Back to agent selection</button><button class="report-link" id="report">View Evaluation Report →</button><section class="panel chart-panel"><div class="dash-top"><div><h2>Execution Speed Benchmark</h2><span class="sub" style="font-size:13px">Completion time (seconds) per challenge</span></div><div class="legend">';
selected.forEach(function(i){d+='<span><i class="dot" style="background:'+themes[i]+'"></i>'+escapeHTML(agents[i][0])+'</span>'});d+='</div></div><div class="chart">'+buildChart()+'</div></section><section class="agent-grid">';
selected.forEach(function(i){var a=agents[i],color=themes[i],idx=window['slide'+i]||1,values=series[i],total=values.reduce(function(sum,n){return sum+n},0),avg=Math.round(total/values.length);if(challengeSeconds[i]===undefined)challengeSeconds[i]=102;d+='<article class="card"><div class="card-head"><div><h3>◉　'+escapeHTML(a[0])+'</h3><span class="model">'+escapeHTML(a[1])+'</span></div><span class="active" style="color:#4ade80;border-color:#4ade80">ACTIVE</span></div><div class="slider"><button class="arrows" data-move="'+i+'" data-step="-1">‹</button>';
[idx-1,idx,idx+1].forEach(function(n){d+='<div class="slide '+(n===idx?'current':'')+'"><small>CHALLENGE '+n+'</small><strong>'+(n>=1&&n<=12?challenges[n-1][0]:'')+'</strong>'+(n===idx?'<div class="progress"><i></i></div>':'')+'</div>'});d+='<button class="arrows" data-move="'+i+'" data-step="1">›</button></div><div class="metrics"><div><small>Trigger</small><strong>Challenge Runner</strong></div><div><small>Success rate</small><strong style="color:#4ade80">83%</strong></div><div><small>Current Challenge Time</small><strong data-timer="'+i+'" style="color:'+color+';font-family:monospace">'+formatTime(challengeSeconds[i])+'</strong></div><div><small>Avg Solve Time / Challenge</small><strong style="color:'+color+';font-family:monospace">'+avg+'s</strong></div><div><small>Total Time</small><strong style="font-family:monospace">'+total+'s</strong></div></div><div class="diffbox"><div class="minus">- return price + txx;</div><div class="plus">+ return price + (price * tax);</div></div></article>'});d+='</section></div>';app.innerHTML=d;
document.getElementById('back').onclick=function(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}view='selection';render()};document.getElementById('report').onclick=function(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}var given=selected.filter(function(i){return i<4}),custom=selected.filter(function(i){return i>=4}).map(function(i){return {name:agents[i][0],model:agents[i][1]}}),query='?agents='+encodeURIComponent(given.join(','));if(custom.length)query+='&custom='+encodeURIComponent(JSON.stringify(custom));location.href='results.html'+query};document.querySelectorAll('[data-move]').forEach(function(b){b.onclick=function(){var i=+b.dataset.move,k='slide'+i;window[k]=Math.max(1,Math.min(12,(window[k]||1)+(+b.dataset.step)));renderExecution()}});if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(function(){selected.forEach(function(i){challengeSeconds[i]=Math.max(0,challengeSeconds[i]-1);var el=document.querySelector('[data-timer="'+i+'"]');if(el)el.textContent=formatTime(challengeSeconds[i])})},1000)}
function formatTime(seconds){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
function buildChart(){var w=900,h=220,l=42,r=12,t=10,b=28,innerW=w-l-r,innerH=h-t-b,values=[0,20,40,60,80,100],s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Completion time per challenge for selected agents">';values.forEach(function(v){var y=t+innerH-(v/100)*innerH;s+='<line class="gridline" x1="'+l+'" y1="'+y+'" x2="'+(w-r)+'" y2="'+y+'"/><text class="axis" x="4" y="'+(y+4)+'">'+v+'s</text>'});for(var j=0;j<5;j++){var x=l+j*innerW/4;s+='<text class="axis" text-anchor="middle" x="'+x+'" y="'+(h-5)+'">Ch '+(j+1)+'</text>'}selected.forEach(function(i){var vals=series[i],pts=vals.map(function(v,j){return (l+j*innerW/4)+','+(t+innerH-(v/100)*innerH)}).join(' ');s+='<polyline fill="none" stroke="'+themes[i]+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/>';vals.forEach(function(v,j){var cx=l+j*innerW/4,cy=t+innerH-(v/100)*innerH;s+='<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="'+themes[i]+'"/>'})});return s+'</svg>'}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&preview>=0){preview=-1;render()}});render();
</script>
</html>
