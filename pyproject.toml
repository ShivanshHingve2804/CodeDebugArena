[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "code-debug-arena"
version = "1.0.0"
description = "A curated benchmark of real-world Python bugs for evaluating AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Shivansh Hingve", email = "shivanshhingve@gmail.com"}]
keywords = ["debugging", "benchmark", "ai-evaluation", "coding-challenges", "python", "testing"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["challenges"]
python_files = ["test_challenge.py"]
